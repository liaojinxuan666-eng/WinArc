name: WinArc
options:
  bundleIdPrefix: com.winarc
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  WinArc:
    type: application
    platform: iOS

    sources:
      - path: WinArc
      - path: WinArcRuntime

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.winarc.app
        INFOPLIST_KEY_CFBundleDisplayName: WinArc
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES

        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: WinArc/WinArc-Bridging-Header.h

        DEAD_CODE_STRIPPING: NO
        STRIP_INSTALLED_PRODUCT: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

        OTHER_LDFLAGS: >-
          $(inherited)
          -force_load
          $(SRCROOT)/../wine/build/winarc-wine-reference-link/libWinArcWineReference.a
          -framework CoreFoundation
          -framework CoreText
          -framework AudioToolbox
          -framework AVFoundation
          -framework IOKit

    postBuildScripts:
      - name: Stage Wine NLS
        script: |
          set -euo pipefail

          NLS_SRC="${SRCROOT}/../wine/build/madeira-wine-reference-src/app/Madeira/nls"
          APP_RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          NLS_DST="${APP_RES}/nls"

          test -d "${NLS_SRC}"
          mkdir -p "${APP_RES}"
          rm -rf "${NLS_DST}"
          /usr/bin/ditto "${NLS_SRC}" "${NLS_DST}"

          test -d "${NLS_DST}"
          echo "WINARC_WINE_NLS_BUNDLED=PASS"
