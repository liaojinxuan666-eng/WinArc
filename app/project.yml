name: WinArc
options:
  bundleIdPrefix: com.winarc
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  WinArc:
    type: application
    platform: iOS

    sources:
      - path: WinArc
      - path: WinArcRuntime

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.winarc.app
        INFOPLIST_KEY_CFBundleDisplayName: WinArc
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES

        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: WinArc/WinArc-Bridging-Header.h

        DEAD_CODE_STRIPPING: NO
        STRIP_INSTALLED_PRODUCT: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

        OTHER_LDFLAGS: >-
          $(inherited)
          -force_load
          $(SRCROOT)/../wine/build/winarc-wine-reference-link/libWinArcWineReference.a
          $(SRCROOT)/../wine/build/graphics/libWinArcDXMT.a
          -lc++
          -lsqlite3
          -framework CoreFoundation
          -framework CoreGraphics
          -framework CoreText
          -framework AudioToolbox
          -framework AVFoundation
          -framework IOKit
          -framework UIKit
          -framework Metal
          -framework MetalFX
          -framework QuartzCore

    postBuildScripts:
      - name: Stage Wine Runtime
        script: |
          set -euo pipefail

          REF_APP="${SRCROOT}/../wine/build/madeira-wine-reference-src/app/Madeira"
          APP_RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"

          NLS_SRC="${REF_APP}/nls"
          NLS_DST="${APP_RES}/nls"

          PE_SRC="${REF_APP}/aarch64-windows"
          PE_DST="${APP_RES}/aarch64-windows"

          PREFIX_ARCHIVE="${REF_APP}/prefix-template.tar.gz"
          PREFIX_DST="${APP_RES}/WinArcPrefixTemplate"
          PREFIX_TMP="${TARGET_TEMP_DIR}/winarc-prefix-template"

          test -d "${NLS_SRC}"
          test -d "${PE_SRC}"
          test -s "${PREFIX_ARCHIVE}"

          test -s "${PE_SRC}/ntdll.dll"
          test -s "${PE_SRC}/kernel32.dll"
          test -s "${PE_SRC}/user32.dll"
          test -s "${PE_SRC}/explorer.exe"

          # DXMT stays available, but it is no longer force-loaded wholesale.
          # The static linker pulls only the objects actually required by the
          # selected runtime path.
          test -s "${PE_SRC}/d3d11.dll"
          test -s "${PE_SRC}/dxgi.dll"
          test -s "${PE_SRC}/winemetal.dll"

          mkdir -p "${APP_RES}"

          rm -rf "${NLS_DST}"
          /usr/bin/ditto "${NLS_SRC}" "${NLS_DST}"

          rm -rf "${PE_DST}"
          /usr/bin/ditto "${PE_SRC}" "${PE_DST}"

          rm -rf "${PREFIX_TMP}" "${PREFIX_DST}"
          mkdir -p "${PREFIX_TMP}" "${PREFIX_DST}"

          /usr/bin/tar -xzf "${PREFIX_ARCHIVE}" -C "${PREFIX_TMP}"

          DRIVE_C="$(
            find "${PREFIX_TMP}" -maxdepth 4 -type d -name drive_c -print -quit
          )"
          test -n "${DRIVE_C}"

          PREFIX_ROOT="$(dirname "${DRIVE_C}")"
          /usr/bin/ditto "${PREFIX_ROOT}" "${PREFIX_DST}"

          test -d "${PREFIX_DST}/drive_c"
          test -f "${PREFIX_DST}/system.reg"
          test -f "${PREFIX_DST}/user.reg"

          test -s "${PE_DST}/explorer.exe"
          test -s "${PE_DST}/d3d11.dll"
          test -s "${PE_DST}/dxgi.dll"
          test -s "${PE_DST}/winemetal.dll"

          # D3DMetal remains a first-class backend slot. A compatible iOS
          # payload is validated by GraphicsBackendBridge when present.
          mkdir -p "${APP_RES}/Graphics/D3DMetal"

          echo "WINARC_WINE_NLS_BUNDLED=PASS"
          echo "WINARC_WINE_PREFIX_TEMPLATE_BUNDLED=PASS"
          echo "WINARC_WINE_EXPLORER_BUNDLED=PASS"
          echo "WINARC_DXMT_PE_RUNTIME_BUNDLED=PASS"
