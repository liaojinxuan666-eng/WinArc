name: WinArc
options:
  bundleIdPrefix: com.winarc
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  WinArc:
    type: application
    platform: iOS

    sources:
      - path: WinArc
      - path: WinArcRuntime

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.winarc.app
        INFOPLIST_KEY_CFBundleDisplayName: WinArc
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES

        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: WinArc/WinArc-Bridging-Header.h

        DEAD_CODE_STRIPPING: NO
        STRIP_INSTALLED_PRODUCT: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

        OTHER_LDFLAGS: >-
          $(inherited)
          -force_load
          $(SRCROOT)/../wine/build/winarc-wine-reference-link/libWinArcWineReference.a
          -force_load
          $(SRCROOT)/../wine/build/graphics/libWinArcDXMT.a
          -lc++
          -lsqlite3
          -framework CoreFoundation
          -framework CoreText
          -framework AudioToolbox
          -framework AVFoundation
          -framework IOKit
          -framework UIKit
          -framework Metal
          -framework MetalFX
          -framework QuartzCore

    postBuildScripts:
      - name: Stage Wine and Graphics Runtime
        script: |
          set -euo pipefail

          REF_APP="${SRCROOT}/../wine/build/madeira-wine-reference-src/app/Madeira"
          APP_RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"

          NLS_SRC="${REF_APP}/nls"
          NLS_DST="${APP_RES}/nls"

          PE_SRC="${REF_APP}/aarch64-windows"
          PE_DST="${APP_RES}/aarch64-windows"

          test -d "${NLS_SRC}"
          test -d "${PE_SRC}"

          # DXMT PE side. These are the exact modules paired with the iOS
          # winemetal host side that is statically linked into WinArc.
          test -s "${PE_SRC}/d3d11.dll"
          test -s "${PE_SRC}/dxgi.dll"
          test -s "${PE_SRC}/winemetal.dll"

          mkdir -p "${APP_RES}"

          rm -rf "${NLS_DST}"
          /usr/bin/ditto "${NLS_SRC}" "${NLS_DST}"

          rm -rf "${PE_DST}"
          /usr/bin/ditto "${PE_SRC}" "${PE_DST}"

          test -s "${PE_DST}/d3d11.dll"
          test -s "${PE_DST}/dxgi.dll"
          test -s "${PE_DST}/winemetal.dll"

          echo "WINARC_WINE_NLS_BUNDLED=PASS"
          echo "WINARC_DXMT_PE_RUNTIME_BUNDLED=PASS"

          # D3DMetal is a first-class WinArc backend, but its Apple framework
          # is intentionally NOT copied from the internet or from Madeira.
          # If a compatible payload is later provided at this path, WinArc's
          # GraphicsBackendBridge will validate it at runtime.
          mkdir -p "${APP_RES}/Graphics/D3DMetal"
