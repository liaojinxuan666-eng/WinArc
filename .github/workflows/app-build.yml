name: WinArc App Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "wine/bootstrap-wine.sh"
      - "wine/check-reference-archives.py"
      - ".github/workflows/app-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "wine/bootstrap-wine.sh"
      - "wine/check-reference-archives.py"
      - ".github/workflows/app-build.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout WinArc
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
          /Applications/Xcode_26.3.app/Contents/Developer/usr/bin/xcodebuild -version

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install bison flex xcodegen
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          xcodegen --version

      - name: Build Wine runtime reference
        shell: bash
        run: |
          set -euo pipefail
          bison --version
          flex --version
          bash wine/bootstrap-wine.sh | tee wine-runtime-bootstrap.log

          grep -Fx "WINARC_WINE_BOOTSTRAP_REVISION=9" wine-runtime-bootstrap.log
          grep -Fx "WINARC_WINE_RELOCATABLE_LINK=PASS" wine-runtime-bootstrap.log
          grep -Fx "WINARC_WINE_BOOTSTRAP=PASS" wine-runtime-bootstrap.log

          test -s wine/build/winarc-wine-reference-link/libWinArcWineReference.a

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd app
          xcodegen generate
          test -d WinArc.xcodeproj

      - name: Build WinArc runtime-probe app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build

          xcodebuild \
            -project app/WinArc.xcodeproj \
            -scheme WinArc \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee app-build.log

      - name: Verify final Mach-O contains Wine
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)"
          test -n "$APP"
          test -d "$APP"

          BIN="$APP/WinArc"
          test -f "$BIN"

          xcrun nm -gU "$BIN" > winarc-app-symbols.txt

          grep -F "_winarc_wine_reference_get_boundary" winarc-app-symbols.txt
          grep -F "_winarc_wine_runtime_is_linked" winarc-app-symbols.txt
          grep -F "_wineserver_main" winarc-app-symbols.txt
          grep -F "___wine_main" winarc-app-symbols.txt

          echo "WINARC_APP_WINE_LINK=PASS"
          echo "WINARC_APP_WINE_DEVICE_EXECUTION=NOT_RUN"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)"
          test -n "$APP"
          test -d "$APP"

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/WinArc.app

          (
            cd build
            /usr/bin/zip -qry WinArc-runtime-probe-unsigned.ipa Payload
          )

          test -s build/WinArc-runtime-probe-unsigned.ipa
          echo "WINARC_APP_BUILD=PASS"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WinArc-runtime-probe-unsigned-ipa
          path: build/WinArc-runtime-probe-unsigned.ipa
          if-no-files-found: error

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinArc-runtime-probe-logs
          path: |
            app-build.log
            wine-runtime-bootstrap.log
            winarc-app-symbols.txt
            wine/build/logs/winarc-reference-unresolved.txt
          if-no-files-found: warn