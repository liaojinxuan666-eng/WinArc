name: Wine bootstrap gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "wine/bootstrap-wine.sh"
      - ".github/workflows/wine-bootstrap.yml"

jobs:
  wine-bootstrap:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout WinArc
        uses: actions/checkout@v4

      - name: Run Wine bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bash wine/bootstrap-wine.sh | tee wine-bootstrap.log

      - name: Verify gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F "WINARC_WINE_BOOTSTRAP=PASS" wine-bootstrap.log
          grep -F "WINE_INPROC_FD_GATE_SOURCE=READY" wine-bootstrap.log
          grep -F "WINE_INPROC_BRIDGE_COMPILE=PASS" wine-bootstrap.log
          grep -F "NEXT_STAGE=PERSISTENT_INPROCESS_WINESERVER" wine-bootstrap.log

      - name: Upload bootstrap log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-bootstrap-log
          path: wine-bootstrap.log
          if-no-files-found: warn
