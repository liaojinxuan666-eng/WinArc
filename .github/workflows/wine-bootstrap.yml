name: Wine bootstrap gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "wine/bootstrap-wine.sh"
      - ".github/workflows/wine-bootstrap.yml"

jobs:
  wine-bootstrap:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout WinArc
        uses: actions/checkout@v4

      - name: Install Wine build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Run Wine bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bison --version
          flex --version
          bash wine/bootstrap-wine.sh | tee wine-bootstrap.log

      - name: Verify gate
        shell: bash
        run: |
          set -euo pipefail

          grep -F "JUICE_IOS_SERVER_PATCHES=PASS" wine-bootstrap.log
          grep -F "WINE_HOST_HEADERS=PASS" wine-bootstrap.log
          grep -F "WINE_HOST_TOOLS=PASS" wine-bootstrap.log

          grep -F "WINE_IOS_SERVER_SOURCE_COUNT=44" wine-bootstrap.log
          grep -F "WINE_IOS_SERVER_OBJECT_COMPILE=PASS" wine-bootstrap.log
          grep -F "WINE_SERVER_THREAD_BRIDGE_OBJECT=PASS" wine-bootstrap.log
          grep -F "WINE_SERVER_RENAMED_MAIN=PASS" wine-bootstrap.log
          grep -F "WINE_IOS_SERVER_STATIC_ARCHIVE=PASS" wine-bootstrap.log

          grep -F "WINE_FULL_IOS_CONFIGURE=SKIPPED" wine-bootstrap.log
          grep -F "MADEIRA_ARCHITECTURE_ADAPTED=STATIC_SERVER_AND_THREAD_BOUNDARY" wine-bootstrap.log

          grep -F "WINARC_WINE_BOOTSTRAP=PASS" wine-bootstrap.log
          grep -F "NEXT_STAGE=IOS_SERVER_RUNTIME_PATCH_SET" wine-bootstrap.log

      - name: Upload Wine build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-bootstrap-log
          path: |
            wine-bootstrap.log
            wine/BASELINE
            wine/build/logs/
            wine/build/libWinArcWineServer.a
          if-no-files-found: warn