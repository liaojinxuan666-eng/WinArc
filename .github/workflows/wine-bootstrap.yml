name: Wine bootstrap gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "wine/bootstrap-wine.sh"
      - ".github/workflows/wine-bootstrap.yml"

jobs:
  wine-bootstrap:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout WinArc
        uses: actions/checkout@v4

      - name: Install Wine build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Run Wine bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bison --version
          flex --version
          bash wine/bootstrap-wine.sh | tee wine-bootstrap.log

      - name: Verify gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F "WINE_HOST_TOOLS=PASS" wine-bootstrap.log
          grep -F "WINE_IOS_CONFIGURE=PASS" wine-bootstrap.log
          grep -F "WINE_IOS_SERVER_OBJECTS=PASS" wine-bootstrap.log
          grep -F "WINE_IOS_SERVER_CORE_LINK=PASS" wine-bootstrap.log
          grep -F "WINE_INPROC_BRIDGE_COMPILE=PASS" wine-bootstrap.log
          grep -F "WINE_INPROC_FD_GATE_SOURCE=READY" wine-bootstrap.log
          grep -F "WINARC_WINE_BOOTSTRAP=PASS" wine-bootstrap.log
          grep -F "NEXT_STAGE=SERVER_THREAD_AND_SIGNAL_ISOLATION" wine-bootstrap.log

      - name: Upload Wine logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-bootstrap-log
          path: |
            wine-bootstrap.log
            wine/build/logs/
          if-no-files-found: warn
