name: Wine bootstrap gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wine/**"
      - "tests/**"
      - ".github/workflows/wine-bootstrap.yml"
  pull_request:
    branches: [main]
    paths:
      - "wine/**"
      - "tests/**"
      - ".github/workflows/wine-bootstrap.yml"

jobs:
  wine-bootstrap:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout WinArc
        uses: actions/checkout@v4

      - name: Test archive validation
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Install Wine build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Run Wine bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bison --version
          flex --version
          bash wine/bootstrap-wine.sh | tee wine-bootstrap.log

      - name: Verify gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "WINARC_WINE_BOOTSTRAP_REVISION=9" wine-bootstrap.log
          grep -Fx "MADEIRA_WINE_NATIVE_ARCHIVES=PASS" wine-bootstrap.log
          grep -Fx "WINARC_REFERENCE_ARCHIVE_AUDIT=PASS" wine-bootstrap.log
          grep -Fx "WINARC_SERVER_CLIENT_STATE_ISOLATION=PASS" wine-bootstrap.log
          grep -Fx "WINARC_WINE_RELOCATABLE_LINK=PASS" wine-bootstrap.log
          grep -Fx "WINARC_WINE_EXECUTABLE_LINK=NOT_RUN" wine-bootstrap.log
          grep -Fx "WINARC_WINE_RUNTIME_EXECUTION=NOT_RUN" wine-bootstrap.log
          grep -Fx "WINARC_WINE_BOOTSTRAP=PASS" wine-bootstrap.log
          test -s wine/build/winarc-wine-reference-link/libWinArcWineReference.a

      - name: Upload Wine build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-bootstrap-log
          path: |
            wine-bootstrap.log
            wine/BASELINE
            wine/build/logs/
          if-no-files-found: warn