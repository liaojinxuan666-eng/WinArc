name: WinArc 0.0.1 Resume Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/madeira-base-build.yml"
      - "app/winarc-runtime-patch.py"

permissions:
  contents: read
  actions: read

jobs:
  app:
    name: Build WinArc 0.0.1 from cached dependencies
    runs-on: macos-15
    timeout-minutes: 120

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MADEIRA_COMMIT: daabd75fc4b09ab32196a2eec010537bf018e108
      WINARC_VERSION: 0.0.1
      REUSE_RUN_ID: "34755112563"

    steps:
      - name: Checkout WinArc
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Install app build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja
          python3 -m py_compile app/winarc-runtime-patch.py

      - name: Checkout pinned Madeira base
        shell: bash
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/Madeira"
          rm -rf "$M"
          git clone \
            --filter=blob:none \
            --no-checkout \
            https://github.com/arjunyerevan95-dot/Madeira.git \
            "$M"
          git -C "$M" checkout "$MADEIRA_COMMIT"
          test "$(git -C "$M" rev-parse HEAD)" = "$MADEIRA_COMMIT"

      - name: Apply WinArc identity
        shell: bash
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/Madeira"
          PLIST="$M/app/Madeira/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName WinArc" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $WINARC_VERSION" "$PLIST"

          DISPLAY="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"

          test "$DISPLAY" = "WinArc"
          test "$VERSION" = "0.0.1"

          python3 - "$M/scripts/ci-build-app.sh" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          old = "PRODUCT_BUNDLE_IDENTIFIER=com.madeira.emulator"
          new = "PRODUCT_BUNDLE_IDENTIFIER=com.winarc.app"

          if old not in text:
              raise SystemExit("Madeira bundle-id build argument changed")

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply WinArc runtime patches
        shell: bash
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/Madeira"

          python3 app/winarc-runtime-patch.py "$M" \
            | tee winarc-runtime-patch.log

          grep -Fx "WINARC_WINE_PE_SOURCE_PROTECT_V1=PASS" winarc-runtime-patch.log
          grep -Fx "WINARC_JIT_CORE_V1=PASS" winarc-runtime-patch.log
          grep -Fx "WINARC_VERSION=0.0.1" winarc-runtime-patch.log
          grep -Fx "WINARC_JIT_POLICY=CAPABILITY_DRIVEN" winarc-runtime-patch.log
          grep -Fx "WINARC_WINE_PATCHES=PE_SOURCE_PROTECT_V1" winarc-runtime-patch.log

      - name: Download FEX from successful run
        uses: actions/download-artifact@v4
        with:
          name: madeira-fex
          path: ${{ runner.temp }}/reuse/fex
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REUSE_RUN_ID }}

      - name: Download LLVM from successful run
        uses: actions/download-artifact@v4
        with:
          name: madeira-llvm
          path: ${{ runner.temp }}/reuse/llvm
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REUSE_RUN_ID }}

      - name: Download patched Wine from successful run
        uses: actions/download-artifact@v4
        with:
          name: madeira-wine
          path: ${{ runner.temp }}/reuse/wine
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REUSE_RUN_ID }}

      - name: Normalize dependency inputs
        shell: bash
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/Madeira"

          for component in fex llvm wine; do
            SRC="$RUNNER_TEMP/reuse/$component"
            DST="$M/build-inputs/$component"

            mkdir -p "$DST"

            TAR="$(find "$SRC" -type f -name "$component-ios.tar.gz" -print -quit)"
            SHA="$(find "$SRC" -type f -name "$component-sha256.txt" -print -quit)"
            COMMIT="$(find "$SRC" -type f -name "$component-source-commit.txt" -print -quit || true)"

            test -n "$TAR"
            test -n "$SHA"
            test -s "$TAR"
            test -s "$SHA"

            cp "$TAR" "$DST/$component-ios.tar.gz"
            cp "$SHA" "$DST/$component-sha256.txt"

            if [ -n "$COMMIT" ] && [ -s "$COMMIT" ]; then
              cp "$COMMIT" "$DST/$component-source-commit.txt"
            fi

            echo "===== $component ====="
            ls -lh "$DST"

            test -s "$DST/$component-ios.tar.gz"
            test -s "$DST/$component-sha256.txt"
          done

          echo "WINARC_DEPENDENCY_INPUTS=PASS"

      - name: Build WinArc 0.0.1
        shell: bash
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/Madeira"

          cd "$M"
          mkdir -p ci-output

          bash scripts/ci-build-app.sh \
            2>&1 | tee ci-output/winarc-0.0.1-build.log

          test -s ci-output/Madeira-unsigned.ipa

      - name: Repackage WinArc 0.0.1 IPA
        shell: bash
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/Madeira"
          P="$RUNNER_TEMP/WinArcPackage"
          OUT="$GITHUB_WORKSPACE/WinArc-0.0.1-unsigned.ipa"

          rm -rf "$P"
          mkdir -p "$P"

          unzip -q "$M/ci-output/Madeira-unsigned.ipa" -d "$P"

          test -d "$P/Payload/Madeira.app"

          mv "$P/Payload/Madeira.app" "$P/Payload/WinArc.app"

          PLIST="$P/Payload/WinArc.app/Info.plist"

          DISPLAY="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"

          test "$DISPLAY" = "WinArc"
          test "$VERSION" = "0.0.1"
          test "$BUNDLE_ID" = "com.winarc.app"

          (
            cd "$P"
            /usr/bin/zip -qry "$OUT" Payload
          )

          test -s "$OUT"
          unzip -t "$OUT" | tail -1

          echo "WINARC_BUILD=PASS"
          echo "WINARC_VERSION=0.0.1"
          echo "WINARC_REUSED_DEPENDENCIES_FROM=$REUSE_RUN_ID"

      - name: Upload WinArc IPA
        uses: actions/upload-artifact@v4
        with:
          name: WinArc-0.0.1-unsigned-ipa
          path: WinArc-0.0.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinArc-0.0.1-resume-logs
          path: |
            winarc-runtime-patch.log
            ${{ runner.temp }}/Madeira/ci-output/winarc-0.0.1-build.log
            ${{ runner.temp }}/Madeira/ci-output/linked-libraries.txt
            ${{ runner.temp }}/Madeira/build/dxmt-ios/obj/*.err
          if-no-files-found: warn
          retention-days: 14